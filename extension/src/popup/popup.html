<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Link-Sentinel</title>
    <link rel="stylesheet" href="popup.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container" id="app-container">
        <div class="empty-state" id="empty-state" style="display: none;">
            <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <div class="empty-text">Hover over a link to scan it.</div>
        </div>

        <div id="scan-content">
            <header class="header">
                <div class="logo-area">
                    <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                    </svg>
                    <span class="logo-text">Link-Sentinel</span>
                </div>
            </header>

            <div class="overall-status-card" id="overall-status-card">
                <div class="overall-label">OVERALL SECURITY VERDICT</div>
                <div class="overall-value" id="overall-value">SCANNING...</div>
            </div>

            <div class="modules-container">
                <!-- URL Reputation -->
                <div class="provider-row" id="url-rep-row">
                    <div class="provider-info">
                        <span class="provider-icon" id="url-rep-icon"></span>
                        <div>
                            <div class="provider-name">URL Reputation</div>
                            <div class="provider-source" id="url-rep-source">Google Safe Browsing</div>
                        </div>
                    </div>
                    <div class="provider-status" id="url-rep-status">SCANNING</div>
                </div>

                <!-- Domain Analysis -->
                <div class="provider-row" id="domain-row">
                    <div class="provider-info">
                        <span class="provider-icon" id="domain-icon"></span>
                        <div>
                            <div class="provider-name">Domain Analysis</div>
                            <div class="provider-source" id="domain-source">AlienVault OTX</div>
                        </div>
                    </div>
                    <div class="provider-status" id="domain-status">SCANNING</div>
                </div>

                <!-- Page Analysis -->
                <div class="provider-row" id="pa-row">
                    <div class="provider-info">
                        <span class="provider-icon" id="pa-icon"></span>
                        <div>
                            <div class="provider-name">Page Analysis</div>
                            <div class="provider-source" id="pa-source">URLScan.io</div>
                        </div>
                    </div>
                    <div class="provider-status" id="pa-status">SCANNING</div>
                </div>

                <!-- VirusTotal Analysis -->
                <div class="provider-row" id="vt-row">
                    <div class="provider-info">
                        <span class="provider-icon" id="vt-icon"></span>
                        <div>
                            <div class="provider-name">Malware Analysis</div>
                            <div class="provider-source" id="vt-source">VirusTotal</div>
                        </div>
                    </div>
                    <div class="provider-status" id="vt-status">SCANNING</div>
                </div>

            </div>

            <div class="details-section" id="details-section" style="display: none;">
                <div class="details-toggle" id="details-toggle">
                    <span>View Technical Details</span>
                    <svg class="chevron-icon" id="details-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </div>
                <div class="details-content" id="details-content" style="display: none;">
                    <div id="domain-details" style="display: none;"></div>
                    <div id="page-analysis-details" style="display: none;"></div>
                    <div id="vt-details" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../../dist/popup/popup.js"></script>
</body>

</html>
